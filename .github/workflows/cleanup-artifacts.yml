name: Cleanup old artifacts

# 每日兜底清理：删除超过 1 天的构建制品。
# 正常流程已通过 upload-artifact 的 retention-days: 1 自动过期，
# 此策略仅用于清理异常中断/旧配置遗留的制品，防止 GB-Hour 存储配额耗尽锁死 CI。
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete artifacts older than 1 day
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const cutoff = 1 * 24 * 60 * 60 * 1000; // 1 天
            let deleted = 0;
            // 分页遍历该仓库全部制品。
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            )) {
              for (const artifact of response.data) {
                const age = now - new Date(artifact.created_at).getTime();
                if (age > cutoff && !artifact.expired) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                  console.log(`deleted ${artifact.name} (age ${Math.round(age / 3600000)}h)`);
                }
              }
            }
            console.log(`cleanup done, deleted ${deleted} artifact(s)`);