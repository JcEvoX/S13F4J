name: CI

# 任意分支 push 或 PR 时触发：运行静态分析、单元测试并编译 debug 产物。

on:
  push:
    branches-ignore:
      - 'automation-schedule-permacache/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze + Test + Build debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 移动端 / 桌面端平台目录会随 flutter pub get 生成，
        # 这里先在 Android 上做完整验证，桌面端留待在对应系统 runner 上扩展。
        platform: [android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable desktop scaffolding (linux)
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # --no-fatal-infos：不同 Flutter 版本对 deprecated 提示的 info 级别不同，
        # 只阻断 warning / error，避免因版本差异导致误判失败。
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: notepad-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build iOS (debug, no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign